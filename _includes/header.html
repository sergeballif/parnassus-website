{%- assign s = site.data.site -%}
<header class="site-header">
  <div class="wrap header-inner">
    <div>
      <p class="brand">{{ s.name }}</p>
      <p class="brand-sub">{{ s.region }}</p>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="#visit">Visit</a>
      <a href="#about">About</a>
      <a href="#shop">Shop online</a>
      <a href="#local">Local books</a>
      {%- if s.email != "" %}
      <a class="nav-call" href="mailto:{{ s.email }}" data-copy-email="{{ s.email }}">Contact</a>
      {%- else %}
      <a class="nav-call" href="tel:{{ s.phone_tel }}">Call us</a>
      {%- endif %}
    </nav>
  </div>
</header>
<div class="toast" id="copy-toast" role="status" aria-live="polite"></div>
