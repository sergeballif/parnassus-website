{%- comment -%}Book artwork for the hours pill. Cloned by assets/js/main.js.{%- endcomment -%}
<template id="tpl-book-open">
<svg class="book book-o" width="84" height="42" viewBox="0 0 84 42" aria-hidden="true" focusable="false">
<path class="bk-cover" d="M1 13Q42 -3 83 13L83 42L1 42Z"></path>
<path class="bk-page-l" d="M4 12Q23 4 42 14L42 42L4 42Z"></path>
<path class="bk-page-r" d="M42 14Q61 4 80 12L80 42L42 42Z"></path>
<path class="bk-line" d="M4 15.5Q23 7.5 42 17.5M42 17.5Q61 7.5 80 15.5"></path>
<path class="bk-gutter" d="M42 14L42 42"></path>
<text x="23" y="29" text-anchor="middle" class="book-text" style="font-size:17px;letter-spacing:.05em">OP</text>
<text x="61" y="29" text-anchor="middle" class="book-text" style="font-size:17px;letter-spacing:.05em">EN</text>
</svg>
</template>
<template id="tpl-book-closed">
<svg class="book book-c" width="110" height="42" viewBox="0 0 110 42" aria-hidden="true" focusable="false">
<rect class="bk-cover" x="1" y="7" width="108" height="70" rx="9"></rect>
<rect class="bk-spine" x="1" y="7" width="10" height="70" rx="5"></rect>
<rect class="bk-frame" x="15" y="12" width="90" height="60" rx="4"></rect>
<text x="60" y="29" text-anchor="middle" class="book-text" style="font-size:16px;letter-spacing:.07em">CLOSED</text>
</svg>
</template>
