{%- comment -%}Book artwork for the hours pill. Cloned by assets/js/main.js.{%- endcomment -%}
<template id="tpl-book-open">

<path d="M1 13Q42 -3 83 13L83 42L1 42Z" fill="#9A5A28" stroke="#FCFAF5" stroke-opacity=".55" stroke-width="1.5" stroke-linejoin="round"></path>
<path d="M4 12Q23 4 42 14L42 42L4 42Z" fill="#FCFAF5"></path>
<path d="M42 14Q61 4 80 12L80 42L42 42Z" fill="#F6EEDD"></path>

<path d="M42 14L42 42" stroke="#C9B896" stroke-width="1.2"></path>
<text x="23" y="29" text-anchor="middle" class="book-text" style="font-size:17px;letter-spacing:.05em;fill:#12302F">OP</text>
<text x="61" y="29" text-anchor="middle" class="book-text" style="font-size:17px;letter-spacing:.05em;fill:#12302F">EN</text>

<rect x="1" y="7" width="10" height="70" rx="5" fill="#6E3E17"></rect>
<rect x="15" y="12" width="90" height="60" rx="4" fill="none" stroke="#F6C27A" stroke-opacity=".7" stroke-width="1.2"></rect>
<text x="60" y="29" text-anchor="middle" class="book-text" style="font-size:16px;letter-spacing:.07em;fill:#FFF3E8">CLOSED</text>
</svg>
</template>
