# ---------------------------------------------------------------------
# COLOR THEMES. Each entry is a complete preset; the site uses the one
# named by `color_theme` in _config.yml. Before launch you can also try
# any preset by clicking the "Colors" buttons at the bottom-left of the
# page, or by adding ?theme=BlueTan to the address.
#
# To add a theme, copy one block, rename it, and change the values.
# Every role must be present. What each role does:
#   dark            header, footer, deepest shade; map outlines, pin and ship line work
#   primary         hero background and map water; main buttons; links
#   primary-bright  bright tint of the primary (spare)
#   soft            pale section background (Shop); map land
#   paper           page background; light fills
#   accent          buttons, today's hours segment
#   ink             text on the accent; map street lines; name-card text
#   gold            small headings on dark backgrounds
#   text, text-soft, text-muted   body text and its lighter shades
#   accent-text     accent-family shade readable as text on white
#   card, border    cards and their borders
#   shadow          drop-shadow color
#   on-dark*        text on dark backgrounds (header, hero, footer)
#   band, on-band   the "Can't find it? We'll order it." strip and its text
#   focus           keyboard-focus ring (must be visible on light and dark)
#   map-*, route-*  walking map (map-accent = Creek Street highlight and pin)
#   book-*          open/closed book above the hours
# ---------------------------------------------------------------------

