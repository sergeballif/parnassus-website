name: Update staff picks

# Pulls the top 3 rows of the published Google Sheet every hour and commits any change.
# To update right away: GitHub, Actions tab, "Update staff picks", Run workflow.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staff-picks
  cancel-in-progress: false

jobs:
  update:
    # Does nothing until the STAFF_PICKS_CSV_URL repo variable is set.
    if: ${{ vars.STAFF_PICKS_CSV_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the Google Sheet
        env:
          # Repo setting: Settings, Secrets and variables, Actions, Variables.
          STAFF_PICKS_CSV_URL: ${{ vars.STAFF_PICKS_CSV_URL }}
        run: python3 scripts/update_staff_picks.py

      - name: Commit changes
        run: |
          git config user.name "staff-picks bot"
          git config user.email "actions@users.noreply.github.com"
          git add _data/staff_picks.json assets/covers
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update staff picks from Google Sheet"
            git push
          fi
